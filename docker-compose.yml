services:
  mealkit:
    # Replace YOUR_DOCKERHUB_USER with your Docker Hub username (same one used in the GitHub secret).
    image: YOUR_DOCKERHUB_USER/mealkit-manager:latest
    # To build locally instead of pulling, uncomment:
    # build: .
    ports:
      - "3800:3800"
    environment:
      TZ: America/Toronto
      # Set a password to protect the portal (HTTP Basic: any username, this password).
      APP_PASSWORD: ""
      HORIZON_WEEKS: "12"
      # Needed to link accounts: at least 16 random characters. Keep it safe; changing it
      # means logins must be entered again.
      SECRET_KEY: ""
      # Hours between background reads of linked accounts (0 turns the background run off).
      SYNC_HOURS: "6"
    volumes:
      - mealkit-data:/data
    restart: unless-stopped

volumes:
  mealkit-data:
