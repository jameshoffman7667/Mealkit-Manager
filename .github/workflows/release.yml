# A release is a push to main that changes VERSION. The workflow reads X.Y.Z from VERSION, checks it,
# tests, builds and pushes mybadreligon/mealkit-manager X.Y.Z, X.Y and latest, then creates the GitHub
# release with `gh release create vX.Y.Z --target $GITHUB_SHA`, which also creates the tag.
# Pushing a tag vX.Y.Z by hand still works as a fallback (same checks, same steps). Both ways share one
# concurrency group per version and refuse a version that already has a release or tag, so a version
# can only be released once. Tags and releases made with the workflow token do not start another run.
name: release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      minor: ${{ steps.plan.outputs.minor }}
      source: ${{ steps.plan.outputs.source }}
      short: ${{ steps.plan.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this push is a release, and validate it
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            SOURCE=tag
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$FILE_VERSION" = "$VERSION" ] || fail "VERSION file ($FILE_VERSION) != tag ($VERSION)"
          else
            SOURCE=main
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              CHANGED=true
            else
              FILES="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
              if grep -Eqx 'VERSION|package\.json' <<< "$FILES"; then CHANGED=true; else CHANGED=false; fi
            fi
            if [ "$CHANGED" != "true" ]; then
              echo "VERSION did not change in this push: not a release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="$FILE_VERSION"
          fi
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION" || fail "Version '$VERSION' is not MAJOR.MINOR.PATCH"
          # the version may be released only once
          if [ "$SOURCE" = "main" ]; then
            git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && fail "Tag v$VERSION already exists"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then fail "A release for v$VERSION already exists"; fi
          # changelog must contain this version with Short <= 50 and Long <= 250 chars
          grep -q "^## v$VERSION " CHANGELOG.md || fail "CHANGELOG.md has no entry for v$VERSION"
          SHORT="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Short:\*\*/{sub(/^\*\*Short:\*\* /,"");print;exit}' CHANGELOG.md)"
          LONG="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Long:\*\*/{sub(/^\*\*Long:\*\* /,"");print;exit}' CHANGELOG.md)"
          [ "${#SHORT}" -gt 0 ] && [ "${#SHORT}" -le 50 ] || fail "Short is ${#SHORT} chars (max 50)"
          [ "${#LONG}" -gt 0 ] && [ "${#LONG}" -le 250 ] || fail "Long is ${#LONG} chars (max 250)"
          {
            echo "release=true"
            echo "source=$SOURCE"
            echo "version=$VERSION"
            echo "minor=${VERSION%.*}"
            echo "short=$SHORT"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $SOURCE"

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install and test
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  image:
    needs: [plan, test]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    # one release per version at a time, whichever way it was started
    concurrency:
      group: release-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHORT: ${{ needs.plan.outputs.short }}
      SOURCE: ${{ needs.plan.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-check that this version is still unreleased
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SOURCE" = "main" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::A release for v$VERSION already exists"; exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: mybadreligon/mealkit-manager
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ needs.plan.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release (also creates the tag)
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION - $SHORT" --notes-file <(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^## v/{exit} f' CHANGELOG.md)
